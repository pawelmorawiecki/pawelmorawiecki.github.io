<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Tree</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    color: #fff;
    font-family: monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  #game {
    position: relative;
    min-height: 100vh;
    padding-bottom: 120px;
  }

  #lines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
  }

  #nodes {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .level-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 60px 20px 0;
    flex-wrap: wrap;
  }

  .circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.7);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    transition: border-color 0.2s, background 0.2s, opacity 0.4s;
    position: relative;
    flex-shrink: 0;
    user-select: none;
  }

  .circle:hover {
    border-color: rgba(255,255,255,1);
    background: rgba(255,255,255,0.05);
  }

  .circle.root {
    width: 80px;
    height: 80px;
    border-color: rgba(255,255,255,0.9);
    border-width: 3px;
  }

  .circle.active {
    border-color: #4ade80;
    background: rgba(74,222,128,0.1);
    cursor: default;
  }

  .circle.active:hover {
    border-color: #4ade80;
    background: rgba(74,222,128,0.1);
  }

  .circle.dead-spin {
    border-color: rgba(255,255,255,0.3);
    animation: spin 1.5s linear forwards;
    cursor: not-allowed;
    pointer-events: none;
  }

  .circle.dead {
    border-color: rgba(255,255,255,0.12);
    opacity: 0.35;
    cursor: not-allowed;
    pointer-events: none;
  }

  .circle.dead:hover {
    border-color: rgba(255,255,255,0.12);
    background: transparent;
  }

  @keyframes revealFade {
    0%   { transform: scale(1);    opacity: 1; }
    40%  { transform: scale(1.15); opacity: 0.6; }
    100% { transform: scale(0.5);  opacity: 0; }
  }

  .circle.reveal-fade {
    animation: revealFade 0.5s ease forwards;
    pointer-events: none;
  }

  @keyframes floatFade {
    0%   { opacity: 1;   transform: translateY(0); }
    30%  { opacity: 1;   transform: translateY(-8px); }
    100% { opacity: 0;   transform: translateY(-22px); }
  }

  .donikad-label {
    position: fixed;
    font-family: monospace;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.05em;
    pointer-events: none;
    white-space: nowrap;
    animation: floatFade 1.4s ease forwards;
    z-index: 10;
  }

  @keyframes spin {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(720deg); }
  }

  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
  }

  #overlay.show {
    display: flex;
  }

  #overlay h1 {
    font-size: 2rem;
    color: #4ade80;
    letter-spacing: 0.1em;
    text-align: center;
  }

  #overlay p {
    color: rgba(255,255,255,0.6);
    font-size: 1rem;
    text-align: center;
    max-width: 400px;
    line-height: 1.6;
  }

  #overlay button {
    background: transparent;
    border: 2px solid #4ade80;
    color: #4ade80;
    padding: 10px 28px;
    font-family: monospace;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: background 0.2s;
  }

  #overlay button:hover {
    background: rgba(74,222,128,0.1);
  }

  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.25);
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    pointer-events: none;
  }

  #hud {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 50;
  }

  #hud-bricks-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #hud-label {
    font-family: monospace;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  #hud-bricks {
    display: flex;
    gap: 5px;
    align-items: center;
    flex-wrap: nowrap;
  }

  .brick {
    width: 32px;
    height: 16px;
    border-radius: 3px;
    transition: transform 0.15s ease, opacity 0.3s ease;
    flex-shrink: 0;
  }

  .brick.full  { background: #c97d20; box-shadow: 0 0 6px rgba(201,125,32,0.4); }
  .brick.empty { background: transparent; border: 1.5px solid rgba(255,255,255,0.18); }

  @keyframes brickDrain {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.35) translateY(-3px); }
    60%  { transform: scale(0.85); }
    100% { transform: scale(1); }
  }

  .brick.draining {
    animation: brickDrain 0.4s ease forwards;
  }

  #overlay.gameover h1 { color: #e53e3e; }
  #overlay.gameover button { border-color: #e53e3e; color: #e53e3e; }
  #overlay.gameover button:hover { background: rgba(229,62,62,0.1); }

  #reveal-btn {
    position: fixed;
    top: 122px;
    right: 24px;
    background: transparent;
    border: 1.5px solid rgba(59,130,246,0.7);
    color: rgba(99,179,237,0.95);
    padding: 9px 16px;
    font-family: monospace;
    font-size: 0.78rem;
    cursor: pointer;
    letter-spacing: 0.04em;
    border-radius: 20px;
    transition: background 0.2s, opacity 0.2s, border-color 0.2s, color 0.2s;
    display: none;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    z-index: 50;
  }

  #reveal-btn:hover:not(:disabled) {
    background: rgba(59,130,246,0.15);
    border-color: rgba(99,179,237,1);
  }

  #reveal-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    border-color: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.3);
  }

  .btn-bricks {
    display: inline-flex;
    gap: 3px;
    align-items: center;
    vertical-align: middle;
  }

  .btn-brick {
    display: inline-block;
    width: 14px;
    height: 8px;
    border-radius: 2px;
    background: #c97d20;
    opacity: 0.9;
  }

  #reveal-btn:disabled .btn-brick {
    background: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
<div id="game">
  <svg id="lines"></svg>
  <div id="nodes"></div>
</div>

<div id="hud">
  <div id="hud-bricks-row">
    <span id="hud-label">Energia\czas</span>
    <div id="hud-bricks"></div>
  </div>
</div>

<button id="reveal-btn" onclick="clearDeadEnds()">⚡ Naćmiecz się! &nbsp;(koszt:&nbsp;<span class="btn-bricks"><span class="btn-brick"></span><span class="btn-brick"></span></span>)</button>

<div id="overlay">
  <h1 id="overlay-title">Rozwiązanie odnalezione.</h1>
  <p id="overlay-msg">Przeszedłeś przez 3 poziomy drzewa.<br>Większość ścieżek prowadziła donikąd.</p>
  <button onclick="resetGame()">Zagraj ponownie</button>
</div>

<div id="hint">Podejmij decyzję — kliknij w kółko</div>

<script>
  const MAX_LEVEL = 3;
  const CHILDREN = 10;
  const LIVE_COUNT = 2;
  const MAX_ENERGY = 10;

  let energy = MAX_ENERGY;
  let gameOver = false;
  let currentLevel = 0;
  let nodeCounter = 0;
  const nodeMap = {}; // id -> { el, level, parent }
  const lineMap = {}; // parentId -> [line elements]

  function renderHUD() {
    const bricks = document.getElementById('hud-bricks');
    bricks.innerHTML = '';
    for (let i = 0; i < MAX_ENERGY; i++) {
      const div = document.createElement('div');
      div.className = 'brick ' + (i < energy ? 'full' : 'empty');
      div.id = 'brick-' + i;
      bricks.appendChild(div);
    }
  }

  function consumeEnergy(amount = 1) {
    if (gameOver || energy <= 0) return;
    for (let i = 0; i < amount; i++) {
      if (energy <= 0) break;
      const brickEl = document.getElementById('brick-' + (energy - 1));
      if (brickEl) {
        brickEl.classList.add('draining');
        brickEl.addEventListener('animationend', () => {
          brickEl.classList.remove('draining', 'full');
          brickEl.classList.add('empty');
        }, { once: true });
      }
      energy--;
    }
    updateRevealBtn();
    if (energy <= 0) {
      setTimeout(() => showGameOver(), 450);
    }
  }

  function updateRevealBtn() {
    const btn = document.getElementById('reveal-btn');
    if (!btn) return;
    const hasTargets = Object.values(nodeMap).some(n => n.idle && !n.isLive && n.level === currentLevel);
    btn.disabled = energy < 2 || !hasTargets || gameOver;
  }

  function clearDeadEnds() {
    if (gameOver || energy < 2) return;
    const targets = Object.values(nodeMap).filter(n => n.idle && !n.isLive && n.level === currentLevel);
    if (targets.length === 0) return;
    consumeEnergy(2);
    targets.forEach(n => {
      n.idle = false;
      n.el.onclick = null;
      n.el.classList.add('reveal-fade');
      n.el.addEventListener('animationend', () => {
        n.el.classList.remove('reveal-fade');
        n.el.classList.add('dead');
      }, { once: true });
    });
    updateRevealBtn();
  }

  function pickLiveIndices() {
    const indices = [];
    while (indices.length < LIVE_COUNT) {
      const r = Math.floor(Math.random() * CHILDREN);
      if (!indices.includes(r)) indices.push(r);
    }
    return indices;
  }

  function createCircle(level, isRoot) {
    const id = nodeCounter++;
    const el = document.createElement('div');
    el.className = 'circle' + (isRoot ? ' root' : '');
    el.dataset.id = id;
    return { id, el, level };
  }

  function getCenterPos(el) {
    const rect = el.getBoundingClientRect();
    const gameRect = document.getElementById('game').getBoundingClientRect();
    return {
      x: rect.left - gameRect.left + rect.width / 2,
      y: rect.top - gameRect.top + rect.height / 2,
    };
  }

  function drawLine(fromEl, toEl, parentId) {
    const svg = document.getElementById('lines');

    // We'll draw after layout settles
    requestAnimationFrame(() => {
      const from = getCenterPos(fromEl);
      const to = getCenterPos(toEl);

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', from.x);
      line.setAttribute('y1', from.y);
      line.setAttribute('x2', to.x);
      line.setAttribute('y2', to.y);
      line.setAttribute('stroke', 'rgba(255,255,255,0.12)');
      line.setAttribute('stroke-width', '1');
      svg.appendChild(line);

      if (!lineMap[parentId]) lineMap[parentId] = [];
      lineMap[parentId].push(line);
    });
  }

  function redrawLines() {
    // Redraw all existing lines based on current positions
    // We store fromId -> [toEl] for redraw
    Object.entries(lineData).forEach(([fromId, toEls]) => {
      const fromEl = nodeMap[fromId].el;
      toEls.forEach((entry, i) => {
        const line = lineMap[fromId]?.[i];
        if (!line) return;
        const from = getCenterPos(fromEl);
        const to = getCenterPos(entry);
        line.setAttribute('x1', from.x);
        line.setAttribute('y1', from.y);
        line.setAttribute('x2', to.x);
        line.setAttribute('y2', to.y);
      });
    });
  }

  const lineData = {}; // parentId -> [childEl, ...]

  function spawnChildren(parentNode) {
    const { id: parentId, el: parentEl, level } = parentNode;
    if (level >= MAX_LEVEL) {
      showWin();
      return;
    }

    document.getElementById('hint').style.display = 'none';

    parentEl.classList.add('active');
    parentEl.onclick = null;

    const liveIndices = pickLiveIndices();
    const row = document.createElement('div');
    row.className = 'level-row';
    document.getElementById('nodes').appendChild(row);

    lineData[parentId] = [];

    for (let i = 0; i < CHILDREN; i++) {
      const isLive = liveIndices.includes(i);
      const child = createCircle(level + 1, false);
      nodeMap[child.id] = { el: child.el, level: child.level, parent: parentId, isLive, idle: true };
      row.appendChild(child.el);

      lineData[parentId].push(child.el);

      child.el.onclick = () => handleClick(child, isLive);

      // Draw line after DOM settles
      setTimeout(() => drawLine(parentEl, child.el, parentId), 50);
    }

    currentLevel = level + 1;

    // Show / refresh reveal button
    const btn = document.getElementById('reveal-btn');
    btn.style.display = 'block';
    updateRevealBtn();

    // Scroll new row into view
    setTimeout(() => {
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  }

  function handleClick(node, isLive) {
    if (gameOver) return;
    if (nodeMap[node.id]) nodeMap[node.id].idle = false;
    consumeEnergy();
    if (energy <= 0) return;
    if (isLive) {
      spawnChildren(node);
    } else {
      node.el.classList.add('dead-spin');
      node.el.onclick = null;
      const label = document.createElement('div');
      label.className = 'donikad-label';
      label.textContent = 'donikąd';
      const r = node.el.getBoundingClientRect();
      label.style.left = (r.left + r.width / 2) + 'px';
      label.style.top  = (r.top - 10) + 'px';
      label.style.transform = 'translateX(-50%)';
      document.body.appendChild(label);
      label.addEventListener('animationend', () => label.remove());
      setTimeout(() => {
        node.el.classList.remove('dead-spin');
        node.el.classList.add('dead');
      }, 1500);
    }
    updateRevealBtn();
  }

  function showWin() {
    gameOver = true;
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('gameover');
    document.getElementById('overlay-title').textContent = 'Rozwiązanie odnalezione.';
    document.getElementById('overlay-msg').innerHTML =
      'Przeszedłeś przez 3 poziomy drzewa.<br>Większość ścieżek prowadziła donikąd.';
    overlay.classList.add('show');
  }

  function showGameOver() {
    gameOver = true;
    const overlay = document.getElementById('overlay');
    overlay.classList.add('gameover');
    document.getElementById('overlay-title').textContent = 'Energia wyczerpana.';
    document.getElementById('overlay-msg').innerHTML =
      'Skończyła Ci się energia zanim odnalazłeś ścieżkę do rozwiązania.<br>Drzewo gry Cię pochłonęło.';
    overlay.classList.add('show');
  }

  function resetGame() {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('show', 'gameover');
    energy = MAX_ENERGY;
    gameOver = false;
    currentLevel = 0;
    nodeCounter = 0;
    Object.keys(nodeMap).forEach(k => delete nodeMap[k]);
    Object.keys(lineMap).forEach(k => delete lineMap[k]);
    Object.keys(lineData).forEach(k => delete lineData[k]);
    document.getElementById('nodes').innerHTML = '';
    document.getElementById('lines').innerHTML = '';
    document.getElementById('hint').style.display = '';
    document.getElementById('reveal-btn').style.display = 'none';
    document.getElementById('reveal-btn').disabled = true;
    renderHUD();
    initGame();
  }

  function initGame() {
    const root = createCircle(0, true);
    nodeMap[root.id] = { el: root.el, level: 0, parent: null };

    const row = document.createElement('div');
    row.className = 'level-row';
    row.style.paddingTop = '90px';
    document.getElementById('nodes').appendChild(row);
    row.appendChild(root.el);

    root.el.onclick = () => spawnChildren(root);
  }

  window.addEventListener('resize', redrawLines);
  renderHUD();
  initGame();
</script>
</body>
</html>
